    <title>Week 15 Tuesday & Thursday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e;
            /* Dark background */
            --container-bg: #3c424f;
            /* Slightly lighter container */
            --text-color: #e8e6e3;
            /* Light text */
            --question-text-color: #8ab4f8;
            /* Light blue for questions */
            --lo-text-color: #b0c4de;
            /* Lighter blue for learning objective */
            --border-color: #555;
            /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd;
            /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button:hover {
            opacity: 0.8;
        }

        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }

        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
            font-weight: bold;
            color: var(--question-text-color);
        }

        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

        .check-button:disabled {
            background-color: var(--button-disabled-bg);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
            font-weight: bold;
            font-size: 1.1em;
            display: block;
            margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }

        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0, 0, 0, 0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }
    </style>
</head>

    <h1>Week 15 Tuesday & Thursday Practice Quiz</h1>
    <div id="quiz-container">

    <script>
        const quizData = [
            // Inflammatory Arthritides Questions
            {
                learningObjective: "LO 1 (Inflammatory Arthritides): Recognize the shared features of the seronegative spondyloarthropathies.",
                question: "A 35-year-old male with a history of psoriasis presents with severe pain and diffuse swelling of his entire right third toe, giving it a 'sausage digit' appearance. This clinical finding, a shared feature of seronegative spondyloarthropathies, is known as:",
                options: {
                    A: "Enthesitis",
                    B: "Dactylitis",
                    C: "Uveitis",
                    D: "Spondylitis"
                },
                correctAnswer: "B",
                rationale: "Dactylitis, or 'sausage digit,' is the diffuse swelling of an entire finger or toe. It is a hallmark feature of seronegative spondyloarthropathies and results from synovitis of the PIP and DIP joints combined with flexor tenosynovitis.",
                source: "'Shared Features of Spondyloarthropathies... 3. Dactylitis... Dactylitis (\"sausage digit\")' (Inflammatory Arthritides, Slides 18, 19, 35)"
            },
            {
                learningObjective: "LO 1 (Inflammatory Arthritides): Recognize the shared features of the seronegative spondyloarthropathies.",
                question: "A 28-year-old man with ankylosing spondylitis complains of significant heel pain. On physical examination, there is tenderness, swelling, and erythema at the site of the Achilles tendon insertion into the calcaneus. This inflammation at the site where a tendon inserts into bone is a characteristic feature of spondyloarthropathies known as:",
                options: {
                    A: "Dactylitis",
                    B: "Uveitis",
                    C: "Enthesitis",
                    D: "Arthritis"
                },
                correctAnswer: "C",
                rationale: "Enthesitis is inflammation at an enthesis, which is the site of insertion of a ligament, tendon, or articular capsule into bone. The Achilles tendon insertion is a common site for enthesitis in seronegative spondyloarthropathies.",
                source: "'Enthesis:= site of insertion of a ligament, tendon or articular capsule into the bone. Enthesis is the site of the initial inflammatory process (Enthesitis) in SpA... Common sites of enthesitis in SpA... Achilles and plantar fascia insertion.' (Inflammatory Arthritides, Slides 14, 20, 35)"
            },
            {
                learningObjective: "LO 1 (Inflammatory Arthritides): Recognize the shared features of the seronegative spondyloarthropathies.",
                question: "A 25-year-old male is diagnosed with inflammatory low back pain. His physician suspects a seronegative spondyloarthropathy and orders genetic testing. The presence of which of the following Major Histocompatibility Complex (MHC) Class I alleles would most strongly support this diagnosis?",
                options: {
                    A: "HLA-DR4",
                    B: "HLA-DQ2",
                    C: "HLA-B27",
                    D: "HLA-A3"
                },
                correctAnswer: "C",
                rationale: "HLA-B27 is a strong genetic risk factor associated with the entire group of seronegative spondyloarthropathies. While not required for diagnosis, its presence is a key shared feature and supports the clinical suspicion.",
                source: "'Genetics: MHC Class I allele: HLA-B27... Shared features: HLA-B27 +' (Inflammatory Arthritides, Slides 12, 35)"
            },
            {
                learningObjective: "LO 2 (Inflammatory Arthritides): Contrast the seronegative spondyloarthropathies based on clinical presentation and associated extra-skeletal manifestations: psoriatic arthritis, reactive arthritis, ankylosing spondylitis and inflammatory bowel disease-associated spondyloarthropathy.",
                question: "A 22-year-old male develops acute, asymmetric oligoarthritis of the lower extremities four weeks after an episode of urethritis. He also complains of eye redness and burning. The classic triad of sterile arthritis, urethritis, and conjunctivitis is the hallmark of which condition?",
                options: {
                    A: "Psoriatic arthritis",
                    B: "Reactive arthritis",
                    C: "Ankylosing spondylitis",
                    D: "IBD-associated arthritis"
                },
                correctAnswer: "B",
                rationale: "Reactive arthritis is classically described by the triad of sterile arthritis, urethritis, and conjunctivitis, which typically occurs within four weeks of a primary urogenital (e.g., Chlamydia) or enteropathic (e.g., Salmonella) infection.",
                source: "'Classically presents with triad of sterile conjunctivitis, sterile urethritis, and sterile arthritis (only 1/3 of patients with reactive arthritis have all 3).' (Inflammatory Arthritides, Slide 40)"
            },
            {
                learningObjective: "LO 2 (Inflammatory Arthritides): Contrast the seronegative spondyloarthropathies based on clinical presentation and associated extra-skeletal manifestations: psoriatic arthritis, reactive arthritis, ankylosing spondylitis and inflammatory bowel disease-associated spondyloarthropathy.",
                question: "A 45-year-old woman with a history of silver, scaly plaques on her elbows and scalp develops arthritis. Her joint involvement is notable for affecting the distal interphalangeal (DIP) joints, and she has pitting of her fingernails. This combination of skin disease, nail changes, and DIP joint arthritis is most characteristic of:",
                options: {
                    A: "Ankylosing spondylitis",
                    B: "Reactive arthritis",
                    C: "Psoriatic arthritis",
                    D: "IBD-associated arthritis"
                },
                correctAnswer: "C",
                rationale: "Psoriatic arthritis is uniquely associated with psoriasis. Nail findings like pitting are common and increase the risk of developing PsA. Arthritis of the DIP joints is a classic pattern of joint involvement in PsA that helps differentiate it from other conditions like rheumatoid arthritis.",
                source: "'Psoriatic arthritis (PsA): Unique features... Psoriasis... Nail psoriasis: Pitting... Increased risk of PsA with nail psoriasis... Distribution: DIP and PIP joints of the hands and feet...' (Inflammatory Arthritides, Slides 43, 44, 47)"
            },
            {
                learningObjective: "LO 2 (Inflammatory Arthritides): Contrast the seronegative spondyloarthropathies based on clinical presentation and associated extra-skeletal manifestations: psoriatic arthritis, reactive arthritis, ankylosing spondylitis and inflammatory bowel disease-associated spondyloarthropathy.",
                question: "A 27-year-old man with a 5-year history of inflammatory low back pain undergoes a spinal X-ray. The images show symmetric involvement of the sacroiliac joints, squaring of the vertebral bodies, and marginal syndesmophytes causing fusion of the lumbar spine, described as a \"bamboo spine.\" This pattern of ascending, symmetric spinal involvement is the hallmark of:",
                options: {
                    A: "Reactive arthritis",
                    B: "Psoriatic arthritis",
                    C: "Diffuse idiopathic skeletal hyperostosis (DISH)",
                    D: "Ankylosing spondylitis"
                },
                correctAnswer: "D",
                rationale: "Ankylosing spondylitis is characterized by a \"Pattern #1\" axial involvement, which is symmetric and ascending, always involving the sacroiliac joints. The late-stage finding of marginal syndesmophytes leading to spinal fusion (\"bamboo spine\") is classic for this condition.",
                source: "'Pattern #1: Ankylosing spondylitis... Symmetric involvement of SI joints... Ascending involvement; 100% involvement of SI joints... Marginal syndesmophytes... Late: \"Bamboo spine\".' (Inflammatory Arthritides, Slides 22, 26, 47)"
            },
            {
                learningObjective: "LO 3 (Inflammatory Arthritides): Separate autoimmune from autoinflammatory mechanisms of arthritis pathogenesis.",
                question: "A patient presents with an acute gouty flare. This condition is characterized by a rapid, stereotyped inflammatory response to monosodium urate crystals. This process is primarily driven by the activation of the innate immune system, specifically the NLRP3 inflammasome, without the involvement of autoantibodies or antigen-specific T-cells. This mechanism is best described as:",
                options: {
                    A: "Autoimmune",
                    B: "Allergic",
                    C: "Autoinflammatory",
                    D: "Infectious"
                },
                correctAnswer: "C",
                rationale: "Autoinflammatory diseases are characterized by inappropriate activation of the innate immune system. Gout is a classic example where crystals activate the NLRP3 inflammasome, leading to inflammation that is not explained by infection, malignancy, or the adaptive immune response (autoantibodies/T-cells).",
                source: "'Autoinflammation: Persistent inflammation not explained by infection, malignancy, or the effects of autoantibodies or antigen-specific T-cells... Inappropriate innate immune system activation... Crystal activates the innate immune system via the NLRP3 inflammasome.' (Inflammatory Arthritides, Slides 51, 52, 55)"
            },
            {
                learningObjective: "LO 3 (Inflammatory Arthritides): Separate autoimmune from autoinflammatory mechanisms of arthritis pathogenesis.",
                question: "Rheumatoid arthritis is a systemic disease characterized by the presence of high-titer autoantibodies such as rheumatoid factor and anti-CCP, along with antigen-specific T-cells that target joint tissues, leading to loss of self-tolerance. This pathogenesis, driven by the adaptive immune system, classifies rheumatoid arthritis as which type of disease?",
                options: {
                    A: "Autoinflammatory",
                    B: "Autoimmune",
                    C: "Degenerative",
                    D: "Infectious"
                },
                correctAnswer: "B",
                rationale: "Autoimmune diseases are defined by a loss of self-tolerance resulting from a response of the adaptive immune system, specifically involving autoantibodies and/or antigen-specific T-cells. Rheumatoid arthritis is a classic example of an autoimmune disease.",
                source: "'Autoimmunity: Loss of self-tolerance due to autoantibodies or antigen-specific T-cells... Adaptive immunity driven.' (Inflammatory Arthritides, Slides 51, 52)"
            },
            {
                learningObjective: "LO 3 (Inflammatory Arthritides): Separate autoimmune from autoinflammatory mechanisms of arthritis pathogenesis.",
                question: "Which of the following is a key feature that distinguishes a primary autoinflammatory disorder, such as Behçet disease, from a primary autoimmune disorder, such as systemic lupus erythematosus?",
                options: {
                    A: "Predominance in females",
                    B: "Involvement of the adaptive immune system with specific autoantibodies",
                    C: "Involvement of the innate immune system without specific autoantibodies",
                    D: "Response to B-cell depleting therapies"
                },
                correctAnswer: "C",
                rationale: "The fundamental distinction is the branch of the immune system that is primarily dysregulated. Autoinflammatory disorders are driven by the innate immune system and lack high-titer autoantibodies, whereas autoimmune disorders are driven by the adaptive immune system and are characterized by such antibodies.",
                source: "'Autoinflammation... effects of autoantibodies or antigen-specific T-cells... Inappropriate innate immune system activation. VS. Autoimmunity... Loss of self-tolerance due to autoantibodies or antigen-specific T-cells.' (Inflammatory Arthritides, Slides 51, 52)"
            },
            {
                learningObjective: "LO 4 (Inflammatory Arthritides): Analyze the key differences in the clinical presentation, pathogenesis, and treatment of the two most common crystalline arthropathies: gout and calcium pyrophosphate deposition (CPPD) disease.",
                question: "A 68-year-old man presents with an acute, painful, swollen knee. A synovial fluid analysis is performed, and polarized light microscopy reveals rhomboid-shaped, weakly positively birefringent crystals. These findings are diagnostic for:",
                options: {
                    A: "Gout (monosodium urate crystals)",
                    B: "Pseudogout (calcium pyrophosphate deposition disease)",
                    C: "Septic arthritis",
                    D: "Rheumatoid arthritis"
                },
                correctAnswer: "B",
                rationale: "The key difference in crystal examination between the two main crystalline arthropathies is the crystal morphology and birefringence. Calcium pyrophosphate dihydrate (CPPD) crystals are rhomboid or rod-shaped and exhibit weak positive birefringence.",
                source: "'Calcium pyrophosphate dihydrate... Rhomboid or rod-shaped... Weakly positive... Calcium Pyrophosphate Deposition Disease (CPPD) (\"pseudogout\").' (Inflammatory Arthritides, Slides 54, 66)"
            },
            {
                learningObjective: "LO 4 (Inflammatory Arthritides): Analyze the key differences in the clinical presentation, pathogenesis, and treatment of the two most common crystalline arthropathies: gout and calcium pyrophosphate deposition (CPPD) disease.",
                question: "A 55-year-old male presents with his first episode of severe joint pain, which woke him from sleep. The pain is localized to the first metatarsophalangeal (MTP) joint, which is exquisitely tender, red, and swollen. This classic presentation, known as podagra, is the most common initial manifestation of which condition?",
                options: {
                    A: "Calcium pyrophosphate deposition (CPPD) disease",
                    B: "Reactive arthritis",
                    C: "Gout",
                    D: "Osteoarthritis"
                },
                correctAnswer: "C",
                rationale: "An acute gout flare frequently presents as a monoarthritis of the lower limb, and the most common joint affected in the first flare (>50%) is the first MTP joint (podagra). In contrast, CPPD disease typically affects the knee or wrist and spares the first MTP.",
                source: "'Gout... Distribution: ...First MTP (podagra; >50% of first flares).' (Inflammatory Arthritides, Slides 57, 66)"
            },
            {
                learningObjective: "LO 4 (Inflammatory Arthritides): Analyze the key differences in the clinical presentation, pathogenesis, and treatment of the two most common crystalline arthropathies: gout and calcium pyrophosphate deposition (CPPD) disease.",
                question: "An X-ray of the wrist is taken for a 75-year-old patient with arthritis. The image reveals linear calcifications within the cartilage of the triangular fibrocartilage complex (TFCC). This radiographic finding, known as chondrocalcinosis, is the hallmark of which crystalline arthropathy?",
                options: {
                    A: "Gout",
                    B: "Calcium pyrophosphate deposition (CPPD) disease",
                    C: "Osteoarthritis",
                    D: "Psoriatic arthritis"
                },
                correctAnswer: "B",
                rationale: "The deposition of CPPD crystals in articular cartilage leads to cartilage calcification, which is visible on X-ray as chondrocalcinosis. This is the supportive radiographic finding for CPPD disease, whereas gout is characterized by \"rat-bite\" erosions.",
                source: "'CPPD on imaging: Chondrocalcinosis (arrows) in CPPD... Supportive findings [CPPD]: Chondrocalcinosis (cartilage calcification).' (Inflammatory Arthritides, Slides 65, 66)"
            },
            // Non-immune Mediated MSK Pain Syndromes Questions
            {
                learningObjective: "LO 1 (Non-immune Mediated MSK Pain Syndromes): Specify the genetic defects in the most common heritable connective tissue diseases and how these defects translate into their respective musculoskeletal and non-musculoskeletal phenotypes: Osteogenesis Imperfecta, Marfan syndrome and Ehlers-Danlos syndrome.",
                question: "A 21-year-old male presents with a history of recurrent shoulder dislocations and generalized joint pain. On examination, he demonstrates marked joint hypermobility and skin hyperextensibility. He also has wide, atrophic, \"cigarette paper\" scars over his knees. These features are most consistent with Classical Ehlers-Danlos Syndrome, which is caused by a genetic defect in which type of collagen?",
                options: {
                    A: "Type I Collagen",
                    B: "Type II Collagen",
                    C: "Type III Collagen",
                    D: "Type V Collagen"
                },
                correctAnswer: "D",
                rationale: "Classical Ehlers-Danlos Syndrome (cEDS) is an autosomal dominant disorder characterized by marked joint hypermobility, skin hyperextensibility, and atrophic scarring. It is caused by mutations in genes (COL5A1 or COL5A2) that encode for Type V collagen.",
                source: "'Classical EDS... Gene affected: COL5A1; COL5A2, Connective tissue component affected: Type V collagen... Autosomal dominant inheritance from defect in Type V collagen (COL5A1 or COL5A2 gene).' (Non-immune Mediated MSK Pain Syndromes, Slides 9, 12, 27)"
            },
            {
                learningObjective: "LO 1 (Non-immune Mediated MSK Pain Syndromes): Specify the genetic defects in the most common heritable connective tissue diseases and how these defects translate into their respective musculoskeletal and non-musculoskeletal phenotypes: Osteogenesis Imperfecta, Marfan syndrome and Ehlers-Danlos syndrome.",
                question: "A 17-year-old male who is exceptionally tall with long limbs and arachnodactyly is evaluated for a connective tissue disorder. An ophthalmologic exam reveals upward ectopia lentis. Cardiovascular imaging shows dilation of the aortic root. These findings are hallmarks of Marfan syndrome. This condition is caused by an autosomal dominant mutation in the FBN1 gene, which encodes for which extracellular matrix protein?",
                options: {
                    A: "Collagen Type I",
                    B: "Collagen Type III",
                    C: "Elastin",
                    D: "Fibrillin-1"
                },
                correctAnswer: "D",
                rationale: "Marfan syndrome is a systemic connective tissue disease caused by an autosomal dominant mutation in the FBN1 gene on chromosome 15. This gene encodes for fibrillin-1, a crucial component of microfibrils that provide structural integrity and regulate TGF-β signaling.",
                source: "'Marfan syndrome... Autosomal dominant genetic mutation in Fibrillin-1 (FBN1) gene on chromosome 15 encoding for fibrillin-1 protein.' (Non-immune Mediated MSK Pain Syndromes, Slides 22, 23, 27)"
            },
            {
                learningObjective: "LO 1 (Non-immune Mediated MSK Pain Syndromes): Specify the genetic defects in the most common heritable connective tissue diseases and how these defects translate into their respective musculoskeletal and non-musculoskeletal phenotypes: Osteogenesis Imperfecta, Marfan syndrome and Ehlers-Danlos syndrome.",
                question: "A 30-year-old woman presents to the emergency department with a spontaneous sigmoid colon rupture. She has a history of easy and extensive bruising. Her physical exam is notable for thin, translucent skin with a prominent venous pattern but no significant joint hypermobility or skin hyperextensibility. This life-threatening presentation is most characteristic of Vascular Ehlers-Danlos Syndrome, which is caused by a defect in which type of collagen?",
                options: {
                    A: "Type I Collagen",
                    B: "Type III Collagen",
                    C: "Type V Collagen",
                    D: "Type XII Collagen"
                },
                correctAnswer: "B",
                rationale: "Vascular Ehlers-Danlos Syndrome (vEDS) is the most severe form, characterized by arterial, uterine, and intestinal fragility and rupture. It is caused by an autosomal dominant defect in the COL3A1 gene, which codes for Type III collagen, a major component of hollow organs and blood vessels. Notably, patients typically lack the significant joint and skin laxity seen in other types.",
                source: "'Vascular EDS... Gene affected: COL3A1, Connective tissue component affected: Type III collagen... Clinical features:... Rupture of uterus or bowel (sigmoid colon)... No hyperelastic skin... Minor to no joint hypermobility.' (Non-immune Mediated MSK Pain Syndromes, Slides 9, 18, 27)"
            },
            {
                learningObjective: "LO 2 (Non-immune Mediated MSK Pain Syndromes): Describe the common clinical features, typical comorbidities, and possible triggers of fibromyalgia.",
                question: "A 45-year-old woman complains of \"hurting all over\" for the past year. She also reports profound fatigue, waking up feeling unrefreshed, and difficulty with concentration, which she describes as \"brain fog.\" On physical exam, she has diffuse tenderness to palpation over both articular and non-articular areas. Laboratory tests, including inflammatory markers and autoantibodies, are normal. Which diagnosis best fits this clinical picture?",
                options: {
                    A: "Rheumatoid arthritis",
                    B: "Polymyalgia rheumatica",
                    C: "Fibromyalgia",
                    D: "Systemic lupus erythematosus"
                },
                correctAnswer: "C",
                rationale: "The cardinal features of fibromyalgia are chronic widespread pain, fatigue, and sleep alterations (including non-restorative sleep). Cognitive dysfunction (\"brain fog\") and diffuse tenderness on exam are also key features. The diagnosis is clinical, made in the absence of inflammatory markers or other explanatory conditions.",
                source: "'Cardinal features are chronic widespread pain, fatigue and sleep alterations... Widespread pain... Fatigue and sleep alterations... 'Brain fog' (difficulty concentration, memory difficulties, cognitive dysfunction)... Diffuse tenderness to palpation on exam, both articular and non-articular.' (Non-immune Mediated MSK Pain Syndromes, Slides 31, 32, 39)"
            },

        const quizContainer = document.getElementById('quiz-container');
        const themeToggleButton = document.getElementById('theme-toggle-button');
        const bodyElement = document.body;

        function applyTheme(theme) {
            if (theme === 'light') {
                bodyElement.classList.add('light-theme');
                themeToggleButton.textContent = 'Switch to Dark Mode';
            } else {
                bodyElement.classList.remove('light-theme');
                themeToggleButton.textContent = 'Switch to Light Mode';
            }
            localStorage.setItem('quizTheme', theme);
        }

        function loadQuiz() {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.id = `q${index}`;

                const loText = document.createElement('div');
                loText.classList.add('learning-objective');
                loText.textContent = qData.learningObjective;
                questionBlock.appendChild(loText);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');
                for (const optionKey in qData.options) {
                    const optionId = `q${index}_${optionKey}`;
                    const label = document.createElement('label');
                    label.htmlFor = optionId;

                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `q${index}`;
                    radioInput.value = optionKey;
                    radioInput.id = optionId;

                    const labelText = document.createElement('span');
                    labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;

                    label.appendChild(radioInput);
                    label.appendChild(labelText);
                    optionsDiv.appendChild(label);
                }
                questionBlock.appendChild(optionsDiv);

                const buttonContainer = document.createElement('div');
                buttonContainer.classList.add('button-container');

                const checkButton = document.createElement('button');
                checkButton.textContent = 'Check Answer';
                checkButton.classList.add('check-button');
                checkButton.onclick = () => checkAnswer(index);
                buttonContainer.appendChild(checkButton);
                questionBlock.appendChild(buttonContainer);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                quizContainer.appendChild(questionBlock);
            });
        }

        function checkAnswer(questionIndex) {
            const questionBlockElement = document.getElementById(`q${questionIndex}`);
            const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');
            if (!selectedRadioButton) {
                alert("Please select an answer first.");
                return;
            }
            const selectedOptionKey = selectedRadioButton.value;
            const qData = quizData[questionIndex];
            const feedbackDiv = questionBlockElement.querySelector('.feedback');
            const correct = selectedOptionKey === qData.correctAnswer;

            let feedbackHTML = '';
            if (correct) {
                feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                feedbackDiv.className = 'feedback correct';
            } else {
                feedbackHTML = `<span class="feedback-status">Incorrect. The correct answer is ${qData.correctAnswer}.</span>`;
                feedbackDiv.className = 'feedback incorrect';
            }

            feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
            feedbackHTML += `<div class="feedback-source"><strong>Source:</strong> ${qData.source}</div>`;

            feedbackDiv.innerHTML = feedbackHTML;
        }

        themeToggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-theme')) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });
